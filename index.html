<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Brain</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:#f5f4f0;color:#1a1a1a;padding:1.5rem;font-size:14px;max-width:960px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.title{font-size:16px;font-weight:600}
.date{font-size:12px;color:#888}
.tabs{display:flex;gap:4px;margin-bottom:1rem;flex-wrap:wrap}
.tab{font-size:12px;padding:5px 14px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;color:#555}
.tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.panel{display:none}.panel.active{display:block}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#999;margin:1.25rem 0 .5rem}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:.85rem 1rem;margin-bottom:.5rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:.5rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:1rem}
.metric{background:#f5f4f0;border-radius:8px;padding:.85rem 1rem;cursor:pointer;transition:background .15s}
.metric:hover{background:#ebe9e3;outline:2px solid #ddd}
.metric-lbl{font-size:10px;color:#999;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.metric-val{font-size:18px;font-weight:500;margin-top:4px}
.metric-hint{font-size:10px;color:#bbb;margin-top:3px}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:6px;margin-bottom:5px}
.b-warn{background:#FAEEDA;color:#633806}
.b-ok{background:#EAF3DE;color:#27500A}
.b-danger{background:#FCEBEB;color:#501313}
.b-neutral{background:#f0efeb;color:#666}
.asset-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:.85rem 1rem;cursor:pointer;transition:border-color .15s}
.asset-card:hover{border-color:#185FA5}
.aname{font-size:13px;font-weight:500;margin-bottom:2px}
.aprice{font-size:18px;font-weight:500;margin:3px 0 2px}
.ameta{font-size:11px;color:#777;line-height:1.6}
.chart-hint{font-size:10px;color:#185FA5;margin-top:4px}
.row{display:flex;align-items:flex-start;gap:10px;padding:.6rem 0;border-bottom:1px solid #f0efeb}
.row:last-child{border-bottom:none}
.rtxt{font-size:13px;line-height:1.5}
.rsub{font-size:11px;color:#888;margin-top:2px}
.ricon{font-size:18px;flex-shrink:0;margin-top:1px}
.btn{font-size:12px;padding:5px 13px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#555;cursor:pointer;margin:4px 4px 0 0}
.btn:hover{background:#f5f4f0}
.btn-primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn-primary:hover{background:#333}
.btn-danger{background:#FCEBEB;color:#501313;border-color:#f09595}
.radar-row{display:flex;align-items:center;gap:8px;padding:.45rem 0;border-bottom:1px solid #f0efeb;font-size:12px;cursor:pointer}
.radar-row:hover{background:#fafaf8}
.radar-row:last-child{border-bottom:none}
.radar-label{color:#777;min-width:140px}
.radar-val{font-weight:500;min-width:90px}
.bar-wrap{flex:1;height:5px;background:#f0efeb;border-radius:3px;overflow:hidden;min-width:60px}
.bar-fill{height:100%;border-radius:3px}
.radar-sig{font-size:11px;color:#999;min-width:160px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;flex-shrink:0;margin-top:4px}
.dot-green{background:#639922}.dot-red{background:#E24B4A}.dot-amber{background:#BA7517}
.red{color:#E24B4A}.amber{color:#BA7517}.green{color:#639922}.blue{color:#185FA5}
input[type=text],input[type=date],select,textarea{width:100%;padding:6px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:#fff;color:#1a1a1a;margin-bottom:8px}
textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.trade-row{display:flex;align-items:center;gap:8px;padding:.5rem 0;border-bottom:1px solid #f0efeb;font-size:12px}
.trade-row:last-child{border-bottom:none}
.trade-asset{font-weight:500;min-width:80px}
.trade-dir{padding:2px 7px;border-radius:5px;font-size:11px;font-weight:500}
.dir-long{background:#EAF3DE;color:#27500A}
.dir-short{background:#FCEBEB;color:#501313}
.trade-result{font-weight:500;min-width:60px}
.result-pos{color:#639922}
.result-neg{color:#E24B4A}
.trade-note{color:#888;flex:1;font-size:11px}
.source-link{display:flex;align-items:center;gap:10px;padding:.5rem 0;border-bottom:1px solid #f0efeb;font-size:13px;cursor:pointer}
.source-link:last-child{border-bottom:none}
.source-link:hover .source-name{color:#185FA5;text-decoration:underline}
.source-name{font-weight:500}
.source-desc{font-size:11px;color:#888;flex:1}
.source-tag{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:500}
.tag-early{background:#EAF3DE;color:#27500A}
.tag-mid{background:#FAEEDA;color:#633806}
.cal-row{display:flex;align-items:flex-start;gap:10px;padding:.5rem 0;border-bottom:1px solid #f0efeb;font-size:12px}
.cal-row:last-child{border-bottom:none}
.cal-date{font-weight:500;min-width:90px;color:#1a1a1a}
.cal-event{flex:1}
.cal-impact{padding:2px 7px;border-radius:5px;font-size:11px;font-weight:500}
.imp-high{background:#FCEBEB;color:#501313}
.imp-mid{background:#FAEEDA;color:#633806}
.imp-low{background:#f0efeb;color:#666}
.tree-node{padding:.4rem 0 .4rem 1rem;border-left:2px solid #e8e8e8;margin-left:.5rem}
.tree-root{font-weight:600;font-size:13px;margin:.t5rem 0 .25rem;border-left:none;padding-left:0;margin-left:0}
.tree-mid{font-size:13px;color:#1a1a1a;padding:.3rem 0 .3rem 1rem}
.tree-leaf{font-size:12px;color:#555;padding:.2rem 0 .2rem 1.5rem;border-left:2px dashed #e8e8e8}
.tree-leaf span{color:#185FA5;font-weight:500}
.heat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin-bottom:.5rem}
.heat-cell{border-radius:8px;padding:.6rem .75rem;font-size:12px;font-weight:500;text-align:center}
.heat-strong{background:#EAF3DE;color:#27500A}
.heat-ok{background:#f5f4f0;color:#555}
.heat-weak{background:#FAEEDA;color:#633806}
.heat-bad{background:#FCEBEB;color:#501313}
.stat-row{display:flex;gap:12px;margin-bottom:1rem;flex-wrap:wrap}
.stat-box{background:#f5f4f0;border-radius:8px;padding:.65rem 1rem;flex:1;min-width:100px}
.stat-lbl{font-size:10px;color:#999;text-transform:uppercase;font-weight:600;letter-spacing:.04em}
.stat-val{font-size:18px;font-weight:500;margin-top:3px}
/* POPUP */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center}
.overlay.open{display:flex}
.popup{background:#fff;border-radius:16px;padding:1.5rem;max-width:480px;width:90%;max-height:85vh;overflow-y:auto;position:relative}
.popup-title{font-size:16px;font-weight:600;margin-bottom:.25rem}
.popup-sub{font-size:12px;color:#888;margin-bottom:1rem}
.popup-close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:18px;cursor:pointer;color:#888}
.popup-section{}
.popup-section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#999;margin-bottom:.4rem}
.popup-row{display:flex;justify-content:space-between;font-size:13px;padding:.3rem 0;border-bottom:1px solid #f0efeb}
.popup-row:last-child{border-bottom:none}
.popup-row-label{color:#777}
.popup-row-val{font-weight:500}
.popup-explain{font-size:13px;line-height:1.6;color:#444;margin-bottom:.75rem}
.popup-link{display:inline-block;lont-size:12px;padding:5px 12px;border:1px solid #185FA5;border-radius:8px;color:#185FA5;text-decoration:none;margin-top:.25rem;margin-right:6px}
.signal-box{border-radius:8px;padding:.5rem .75rem;font-size:12px;font-weight:500;margin-bottom:.5rem}
.sig-buy{background:#EAF3DE;color:#27500A}
.sig-wait{background:#FAEEDA;color:#633806}
.sig-avoid{background:#FCEBEB;color:#501313}
</style>
</head>
	<body>
<div class="topbar">
  <span class="title">📊 Trading Brain</span>
  <span class="date" id="today-date"></span>
</div>
<soutput>Im Aufbau... Full Dashboard folgt sofort.</soutput>
<script>
document.getElementById('today-date').textContent = new Date().toLocaleDateString('de-DE',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
</script>
</body>
</html>
